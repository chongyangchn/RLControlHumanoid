# humanoid/configs/ppo_walking.yaml

path:
  xml_path: "Y:/RobotTransition/Project/cyRobotic/RLControlHumanoid/resources/robots/unitree_g1/scene.xml"
  logger_dir: "Y:/RobotTransition/Project/cyRobotic/RLControlHumanoid/outputs/logs/ppo_train"
  model_dir: "Y:/RobotTransition/Project/cyRobotic/RLControlHumanoid/outputs/model/ppo_train"

# 环境参数 (Environment)
env:
  render: false                       # 训练时是否开启渲染（会变慢）
  action_repeat: 2 # 动作重复次数，对应底盘控制的采样周期
  action_scale: 0.5
  reward_scaling:
    # === 核心正向奖励 ===
    vel: 1.0,          # 速度跟踪（最重要的任务目标）
    survival: 0.05,    # 生存奖励（只要没摔，就给一点点甜头）
    height: 0.2,       # 高度奖励（维持稳定高度，防止躺地）
    upright: 0.2,      # 直立奖励（防止侧翻/仰翻，但不能太强，否则机器人不敢动）

    # === 致命惩罚（解决抽搐和空翻的关键！） ===
    smooth: -0.02,     # 动作平滑惩罚（防止高频抖动。如果还在抽搐，请改为 -0.05 或 -0.1！）
    torque: -1e-5,     # 扭矩惩罚（防止用蛮力维持平衡，导致突然摔倒）
    joint_acc: -5e-7,  # ★★★ 关节加速度惩罚（防止抽搐的核武器！必须要有！）
    foot_contact: 0.1, # 足部接触奖励（鼓励双脚交替落地，防止滑行）


# PPO 算法超参数 (Agent)
ppo:
  gamma: 0.99             # 折扣因子，决定了对未来奖励的重视程度
  lam: 0.95               # GAE 参数，平衡方差与偏差
  clip_epsilon: 0.2           # PPO 裁剪阈值
  lr: 0.0001              # 学习率，建议从 3e-4 开始
  entropy_coef: 0.05
  value_loss_coef: 0.5
  update_epochs: 3            # 每次收集完数据后的更新次数
  update_timestep: 8192   # 积累多少步数据进行一次更新
  batch_size: 256
  buffer_size: 2048
  hidden_dim:  256         # 神经网络隐藏层维度


# 训练过程参数
train:
  max_episodes: 100_000
  steps_per_epoch: 2048
  log_interval: 20          # 每多少步打印一次训练信息
  save_interval: 50_000     # 每多少步保存模型
  eval_interval: 10_000     # 每多少步进行一次评估（带渲染）
  render_eval: true         # 评估时是否渲染 GUI
